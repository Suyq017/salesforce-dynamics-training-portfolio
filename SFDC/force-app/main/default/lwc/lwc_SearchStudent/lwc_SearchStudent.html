<!--
 * lwc_SearchStudent.html
 * 学生検索コンポーネントのHTMLテンプレート
 * @created 2026/06/22 Nguyen Ngoc Quy
 -->
<template>
    <c-lwc_-detail-student></c-lwc_-detail-student>
    <c-lwc_-create-student onstudentcreatedsuccessfully={handleStudentCreated}></c-lwc_-create-student>
    <c-lwc_-update-student onstudentupdatedsuccessfully={handleStudentUpdated}></c-lwc_-update-student>

    <template lwc:if={spinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>

    <lightning-card>

        <lightning-layout multiple-rows="true">

                <lightning-input name="studentCode"
                            label="学生コード"
                            value={searchKey.studentCode}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}>
                </lightning-input>

                <lightning-input name="studentName"
                            label="名前"
                            value={searchKey.studentName}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}>
                </lightning-input>

                <lightning-combobox name="class"
                                label="クラス"
                                value={searchKey.class}
                                class="slds-m-right_medium"
                                onchange={handleSearchKeyChange}
                                placeholder="--なし--"
                                options={classOptions}>
                </lightning-combobox>

                <lightning-combobox name="gender"
                            label="性別"
                            value={searchKey.gender}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}
                            placeholder="--なし--"
                            options={genderOptions}>
                </lightning-combobox>

                <lightning-input name="birthday"
                            label="生年月日"
                            type="date"
                            date-style="short"
                            value={searchKey.birthday}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}>
                </lightning-input>
                            
                <lightning-combobox name="dayOfBirth"
                            label="日生"
                            value={searchKey.dayOfBirth}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}
                            options={dayOptions}
                            placeholder="--なし--">
                </lightning-combobox>

                <lightning-combobox name="monthOfBirth"
                            label="月生"
                            value={searchKey.monthOfBirth}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}
                            options={monthOptions}
                            placeholder="--なし--">
                </lightning-combobox>

                <lightning-combobox name="yearOfBirth"
                            label="年生"
                            value={searchKey.yearOfBirth}
                            class="slds-m-right_medium"
                            onchange={handleSearchKeyChange}
                            options={yearOptions}
                            placeholder="--なし--">
                </lightning-combobox>

        </lightning-layout>

        <lightning-layout>
            <lightning-layout-item padding="around-small">
                <lightning-button icon-name="utility:search" 
                                    label="検索" 
                                    variant="brand" 
                                    onclick={handleSearch}>
                </lightning-button>
                <lightning-button icon-name="utility:add" 
                                    label="作成" 
                                    variant="neutral" 
                                    onclick={openCreateStudentModal}>
                </lightning-button>
                <lightning-button icon-name="utility:clear" 
                                    label="クリア" 
                                    variant="neutral" 
                                    onclick={handleClearSearch}
                                    disabled={disableClearSearchButton}>
                </lightning-button>
                <lightning-button icon-name="utility:delete" 
                                        label="削除" 
                                    variant="neutral" 
                                    onclick={openDeleteStudentConfirmationModal}
                                    data-id="deleteListSelectedStudents"
                                    disabled={isNotAnySelectedStudent}>
                </lightning-button>
            </lightning-layout-item>
        </lightning-layout>

        <template lwc:if={totalRecords}>
            <div class="table-result">                
                <table class="slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout">
                    <thead>
                        <tr>
                            <th scope="col" class="slds-border_bottom" width="5%">
                                <lightning-input type="checkbox" 
                                            name="selectAll" 
                                            checked={allStudentsSelected}
                                            onchange={handleSelectAllStudents}>
                                </lightning-input>
                            </th>
                            <th scope="col" class="slds-border_bottom" width="10%">学生コード</th>
                            <th scope="col" class="slds-border_bottom" width="15%">姓</th>
                            <th scope="col" class="slds-border_bottom" width="15%">名</th>
                            <th scope="col" class="slds-border_bottom" width="15%">生年月日</th>
                            <th scope="col" class="slds-border_bottom" width="10%">性別</th>
                            <th scope="col" class="slds-border_bottom" width="15%">クラス</th>
                            <th scope="col" class="slds-border_bottom" width="15%">アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={currentPageStudentsList} for:item="student">
                            <tr key={student.Id}>
                                <td><lightning-input type="checkbox" 
                                                    name={student.Id}
                                                    checked={student.isSelected}
                                                    onchange={handleSelectedStudent}>
                                    </lightning-input>  
                                </td>
                                <td onclick={openDetailStudentModal} data-id={student.Id} class="studentCodeViewDetail">
                                    <p class="slds-truncate slds-text-link" title={student.StudentCode__c}>
                                        {student.StudentCode__c}
                                    </p>
                                </td>
                                <td >{student.Lastname__c}</td>
                                <td>{student.Firstname__c}</td>
                                <td>{student.Birthday__c}</td>
                                <td>{student.Gender__c}</td>
                                <td>{student.Class}</td>
                                <td>    
                                    <lightning-button icon-name="utility:preview" 
                                                    variant="base" 
                                                    onclick={openDetailStudentModal}
                                                    value={student.Id}>
                                    </lightning-button>
                                    <lightning-button icon-name="utility:edit" 
                                                    variant="base" 
                                                    onclick={openUpdateStudentModal}
                                                    value={student.Id}>
                                    </lightning-button>
                                    <lightning-button icon-name="utility:delete" 
                                                    variant="base" 
                                                    onclick={openDeleteStudentConfirmationModal}
                                                    data-id="deleteSpecificIdStudent"
                                                    value={student.Id}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            Selected {selectedStudentsCount} / {totalRecords}
            </div>
            
            <div class="slds-text-align_center">
                <lightning-button label="&lt;&lt;" variant="neutral" onclick={handleFirstPage} disabled={isFirstPage}></lightning-button>
                <lightning-button label="&lt;" variant="neutral" onclick={handlePreviousPage} disabled={isFirstPage}></lightning-button>
                <template for:each={pageNums} for:item="pageNum">
                    <lightning-button key={pageNum.value}
                                    label={pageNum.value} 
                                    variant={pageNum.variant}
                                    onclick={handlePageChange}
                                    value={pageNum.value}>
                    </lightning-button>
                </template>
                <lightning-button label="&gt;" variant="neutral" onclick={handleNextPage} disabled={isLastPage}></lightning-button>
                <lightning-button label="&gt;&gt;" variant="neutral" onclick={handleLastPage} disabled={isLastPage}></lightning-button>
            </div>
        </template>
        
    </lightning-card>

    <template lwc:if={openDeleteModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container slds-p-top_x-small slds-p-bottom_x-small">

                <button class="slds-button slds-button_icon slds-modal__close" onclick={closeDeleteModal} aria-hidden="true">
                    <lightning-icon size="small" icon-name="utility:close" alternative-text="Close"></lightning-icon>
                </button>

                <div class="slds-modal__header">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">学生を削除</h1>
                </div>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-layout>
                        <lightning-layout-item size="12" class="slds-text-align_center">
                            <lightning-formatted-text value="この学生の削除を実行しますか？" 
                                                    class="slds-text-heading_medium slds-text-align_center">
                            </lightning-formatted-text> 
                        </lightning-layout-item>
                    </lightning-layout>
                </div>

                    <div class="slds-modal__footer slds-modal__footer_directional">
                        <lightning-layout class="slds-float_right">
                            <lightning-layout-item size="12" class="slds-text-align_right slds-m-top_medium">
                                <lightning-button variant="neutral" 
                                label="キャンセル" 
                                onclick={closeDeleteModal}
                                class="slds-m-right_small">
                                </lightning-button>
                                <lightning-button variant="brand" 
                                                    label="削除" 
                                                    onclick={confirmDeleteStudent}>
                                </lightning-button>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>
            </section>
        
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
